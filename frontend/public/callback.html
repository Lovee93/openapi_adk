
<!DOCTYPE html>
<html>
<head>
    <title>Authenticating...</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: white; }
        .card { background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Success!</h2>
        <p>Transferring authorization to the agent...</p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        if (window.opener) {
            // Send the code back to the Sandbox app
            window.opener.postMessage({
                type: 'OAUTH_COMPLETE',
                code: code,
                state: state
            }, "*");
            // Close the popup
            setTimeout(() => window.close(), 1000);
        } else {
            document.body.innerHTML = "<h2>Error</h2><p>Could not find opener window. Please copy the code manually if needed.</p>";
        }
    </script>
</body>
</html>
